          jq -r '.files[] | [.path, .bytes, .sha256, .blobSha1] | @tsv' "$work/source-files.json" > "$work/source-files.tsv"
          mkdir "$work/project"
          source_deadline=$((SECONDS + 150))
          while IFS=$'\t' read -r file size sha blob; do
            (( SECONDS < source_deadline ))
            [[ "$file" =~ ^[A-Za-z0-9_./-]+$ && "$file" != /* && "/$file/" != */../* ]]
            [[ ! "$file" =~ (^|/)\.env(\.|$) && ! "$file" =~ (^|/)\.npmrc$ ]]
            mkdir -p -- "$work/project/$(dirname -- "$file")"
            get_public "https://raw.githubusercontent.com/flowwweb/sailingsimulator/$SOURCE_COMMIT/$file" > "$work/project/$file"
            test "$(wc -c < "$work/project/$file")" = "$size"
            printf '%s  %s\n' "$sha" "$work/project/$file" | sha256sum --check --strict
            actual_blob=$({ printf 'blob %s\0' "$size"; cat "$work/project/$file"; } | sha1sum | cut -d' ' -f1)
            test "$actual_blob" = "$blob"
          done < "$work/source-files.tsv"
          cd "$work"
          cat > check-build.cjs <<'JS'
          'use strict';
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const { spawnSync } = require('node:child_process');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const report = { sourceCommit: '9ccfde41e678fa91a0c7a7befdd5f6077fb40a17', stages: [], dependencyClearance: false, browserOrReleaseClaim: false };
          let compressed;
          function emit(label, bytes) {
            console.log(label + '_BEGIN');
            const encoded = bytes.toString('base64');
            for (let start = 0; start < encoded.length; start += 120) console.log(encoded.slice(start, start + 120));
            console.log(label + '_END');
          }
          function filesIn(root, ignored = []) {
            const result = [];
            function visit(relative) {
              for (const name of fs.readdirSync(path.join(root, relative))) {
                const next = relative ? relative + '/' + name : name;
                if (ignored.includes(next)) continue;
                const stat = fs.lstatSync(path.join(root, next));
                assert.ok(!stat.isSymbolicLink(), 'Unexpected symlink: ' + next);
                if (stat.isDirectory()) visit(next);
                else { assert.ok(stat.isFile(), 'Unexpected file type: ' + next); result.push(next); }
              }
            }
            visit('');
            return result.sort();
          }
          function main() {
            assert.equal(process.version, 'v24.22.1');
            const npmRoot = '/usr/local/lib/node_modules/npm';
            assert.equal(JSON.parse(fs.readFileSync(npmRoot + '/package.json', 'utf8')).version, '11.19.1');
            assert.equal(process.getuid(), 1000);
            for (const key of Object.keys(process.env)) assert.ok(['PATH', 'HOME', 'PWD'].includes(key), 'Unexpected environment key: ' + key);
            for (const forbidden of ['/var/run/docker.sock', '/run/docker.sock', '/github', '/__w']) assert.ok(!fs.existsSync(forbidden));
            const source = JSON.parse(fs.readFileSync('/work/source-files.json', 'utf8'));
