# SOURCE PROPOSAL: new install/signature/native execution boundary requires Lab delta acceptance before publication.
name: Fair Winds public checks and source build
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: fair-public-checks
  cancel-in-progress: false
jobs:
  checks:
    if: github.repository == 'flowwweb/sailingsimulator' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check pinned public source in restricted disposable container
        shell: bash
        env:
          SOURCE_COMMIT: 9ccfde41e678fa91a0c7a7befdd5f6077fb40a17
        run: |
          set -euo pipefail
          umask 077
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          work=$(mktemp -d)
          cid=''
          cleanup() {
            primary_status=$?
            trap - EXIT
            set +e
            removal_status=0
            removal_outcome=not_created
            if [[ -n "$cid" ]]; then
              timeout --signal=KILL 15s docker rm -f "$cid"
              removal_status=$?
              removal_outcome=removed
              if [[ "$removal_status" != 0 ]]; then removal_outcome=failed; fi
            fi
            timeout --signal=KILL 10s rm -rf -- "$work"
            temp_status=$?
            printf 'FAIR_CLOSURE primary=%s container=%s container_status=%s temp_status=%s\n' "$primary_status" "$removal_outcome" "$removal_status" "$temp_status"
            printf 'Closure: primary=%s; container=%s (status %s); temporary directory removal status=%s.\n' "$primary_status" "$removal_outcome" "$removal_status" "$temp_status" >> "$GITHUB_STEP_SUMMARY"
            summary_status=$?
            if [[ "$primary_status" != 0 ]]; then exit "$primary_status"; fi
            if [[ "$removal_status" != 0 || "$temp_status" != 0 || "$summary_status" != 0 ]]; then exit 1; fi
          }
          trap cleanup EXIT
          export DOCKER_CONFIG="$work/docker-config"
          mkdir "$DOCKER_CONFIG"
          unset DOCKER_HOST DOCKER_CONTEXT DOCKER_AUTH_CONFIG
          get_public() {
            curl -q --noproxy '*' --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 30 --max-redirs 0 --max-filesize 262144 "$1"
          }
          get_public https://api.github.com/repos/flowwweb/sailingsimulator > "$work/repository.json"
          jq -e '.full_name == "flowwweb/sailingsimulator" and .private == false and .visibility == "public"' "$work/repository.json"
          get_public "https://api.github.com/repos/flowwweb/sailingsimulator/git/commits/$SOURCE_COMMIT" > "$work/commit.json"
          jq -e '.sha == "9ccfde41e678fa91a0c7a7befdd5f6077fb40a17" and .tree.sha == "1a33d4214094197befb6f8282dfbaddd46b7fc5e"' "$work/commit.json"
